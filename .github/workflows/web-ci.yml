name: Web PWA CI
on:
  push:
    branches: [main, feature/web-pwa-mvp]
  pull_request:
    branches: [main]
jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Upload web distribution
        uses: actions/upload-artifact@v4
        with:
          name: taalboek-web-dist
          path: web/dist/
          retention-days: 14
